<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPIc 스피킹 트레이너</title>
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#3d4a66;--mute:#7a8399;--line:#e4e1d8;--paper:#fbf8f1;--card:#fff;--accent:#e8743b;--accent2:#fbe3d4;--teal:#2f8f83;--teal2:#dcefeb;--hl:#fff1a8;--bad:#c94a4a;--good:#2f8f83;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 18px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:24px;letter-spacing:-.5px}
.brand span{color:var(--accent)}
.sub{color:var(--mute);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf8ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:200px;padding:9px 6px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px 20px;position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{font-family:Fraunces,serif;font-size:28px;line-height:1.15;margin:0 0 8px}
.hero p{margin:0;color:#c9d0e0;font-size:14px}
.hero .dots{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--accent);opacity:.9}
.hero .dots2{position:absolute;right:50px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:var(--teal);opacity:.8}
.hero > *{position:relative}
.stat{display:flex;gap:10px;margin-top:16px}
.stat div{background:#ffffff18;border-radius:12px;padding:8px 12px;font-size:12px;color:#c9d0e0}
.stat b{display:block;color:#fff;font-size:18px}
h2.sec{font-size:15px;margin:22px 2px 10px;color:var(--ink2);display:flex;align-items:center;gap:8px}
h2.sec small{color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;transition:transform .12s}
.topic:active{transform:scale(.98)}
.topic .tn{font-weight:700;font-size:15px}
.topic .tc{font-size:12px;color:var(--mute);margin-top:2px}
.bar{height:5px;background:#eee8dc;border-radius:5px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.kind{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--teal2);color:var(--teal)}
.kind.c{background:var(--accent2);color:var(--accent)}
.kind.r{background:#e6e3f5;color:#5b4fa8}
.list{display:flex;flex-direction:column;gap:8px}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.qrow .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.qrow.done .num{background:var(--teal);color:#fff}
.qrow .qk{font-weight:600;font-size:14.5px}
.lv{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:1px}
.lv.Int{background:#e8f0fb;color:#3a63a8}.lv.Adv{background:var(--accent2);color:var(--accent)}
.gen{font-size:11px;color:var(--mute);margin-left:4px}
.back{font-size:14px;color:var(--ink2);font-weight:600;padding:6px 0;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.qtitle{font-weight:700;font-size:17px;margin:6px 0 10px}
.qen{font-size:15px;color:var(--ink2);background:var(--paper);border-radius:12px;padding:12px 14px;transition:filter .2s}
.qen.hide{filter:blur(6px);user-select:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:9px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #c94a4a33}}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}
.ans{font-size:16px;line-height:1.8;margin-top:12px}
.ans p{margin:0 0 10px}
.s{cursor:pointer;border-radius:4px;transition:background .2s}
.s.now{background:var(--teal2)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--accent);color:transparent;cursor:pointer;user-select:none;border-radius:2px}
.blank.open{color:var(--accent);font-weight:600}
.hid .s{filter:blur(5px)}
.hid .s.peek{filter:none}
.hint .s .rest{color:transparent;background:repeating-linear-gradient(90deg,#e9e4d7 0 6px,transparent 6px 9px);border-radius:3px}
.hint .s.peek .rest{color:inherit;background:none}
.xp{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.xp div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--paper);border-radius:10px;font-size:14px}
.xp b{font-weight:600}
.xp span{color:var(--ink2);text-align:right}
.xp div.hit{background:var(--teal2)}
.tip{background:var(--accent2);border-radius:12px;padding:12px 14px;font-size:14px;color:#7a3a17}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:#fffefb;resize:vertical}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}
.score{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.score div{flex:1;min-width:90px;background:var(--paper);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mute)}
.score b{display:block;font-size:20px;color:var(--ink)}
.ai{white-space:pre-wrap;background:#f4f2ff;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:10px}
.hidden{display:none!important}
/* mock */
.exam{background:#1b2540;color:#fff;border-radius:22px;padding:18px;min-height:60vh;display:flex;flex-direction:column}
.exam .top{display:flex;justify-content:space-between;font-size:13px;color:#a9b3cc}
.exam .clock{font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.ava{width:120px;height:120px;border-radius:50%;margin:26px auto 12px;background:radial-gradient(circle at 50% 38%,#f3c9a9 0 24%,transparent 25%),radial-gradient(circle at 50% 100%,var(--accent) 0 46%,transparent 47%),#2a3658;position:relative;transition:box-shadow .2s}
.ava.talk{box-shadow:0 0 0 8px #e8743b44,0 0 0 18px #e8743b1a}
.ava:after{content:"";position:absolute;left:28%;top:12%;width:44%;height:22%;border-radius:50% 50% 30% 30%;background:#3a2a22}
.qno{text-align:center;font-family:Fraunces,serif;font-size:30px;font-weight:800}
.qno small{display:block;font-family:"IBM Plex Sans KR";font-size:12px;font-weight:500;color:#a9b3cc}
.exam .btn{background:#ffffff14;border-color:#ffffff22;color:#fff}
.exam .btn.acc{background:var(--accent);border-color:var(--accent)}
.exam .btn.rec{background:var(--bad);border-color:var(--bad)}
.exam textarea{background:#ffffff0d;border-color:#ffffff22;color:#fff}
.exam .note{color:#a9b3cc}
.prog{display:flex;gap:3px;margin:12px 0}
.prog i{flex:1;height:4px;border-radius:3px;background:#ffffff22}
.prog i.d{background:var(--teal)}.prog i.c{background:var(--accent)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;cursor:pointer}
.opt label.on{border-color:var(--ink);background:#f3f1ea}
.opt input{margin-top:4px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grade{font-family:Fraunces,serif;font-size:76px;font-weight:800;line-height:1;color:var(--accent);text-align:center;margin:10px 0 4px}
.ladder{display:flex;gap:3px;margin:14px 0}
.ladder span{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:6px;background:#eee8dc;color:var(--mute);font-weight:600}
.ladder span.on{background:var(--accent);color:#fff}
.rq{border-top:1px solid var(--line);padding:12px 0}
.rq .h{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.rq .t{font-size:13.5px;color:var(--ink2);margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--teal2);color:var(--teal);flex:none}
.modal{position:fixed;inset:0;background:#14213d88;display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{max-width:440px;width:100%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs">
 <button data-tab="home" class="on">홈</button>
 <button data-tab="practice">연습</button>
 <button data-tab="mock">실전 모의고사</button>
</nav>
<script>
const DB=[];let _id=0;function A(o){o.id="q"+(++_id);DB.push(o)}
// Housing
A({t:"housing",n:"집",q:"I would like to know where you live. Describe your house in detail. What does it look like? How many rooms do you have? Which is your favorite room at home?",k:"나의 집 묘사 (가장 좋아하는 방)",lv:"Int",
a:`Well, let me tell you about the apartment I live in with my family. I have been living here for about, um, 5 years now. It's a cozy place with three bedrooms, two bathrooms and two balconies. There is also a living room, a kitchen, and a storage room.
In the living room, we have various types of furniture like a sofa and a tea table. And there are various types of home appliances in the kitchen like a fridge, a microwave, and a stove.
My favorite room at home is my bedroom. It's definitely the best place to get some rest. You know, I can kick back and relax there. In my room, I have a desk, a chair, a bed and some closets and dressers. I can do almost everything in my room. I can get some sleep, study, listen to music, surf the internet, or watch TV.
So yeah! That's the apartment I call home!`,
x:[["let me tell you about ~","~에 대해 말해줄게 (도입 필러)"],["I have been living here for ~","현재완료진행: ~동안 살아오고 있다"],["get some rest","쉬다"],["kick back and relax","편히 쉬다"],["That's the apartment I call home","마무리 문장"]]});
A({t:"housing",n:"집",q:"Now, tell me about the things that you do at home. What are some daily routines you engage in? What is special about each activity? Give me all the details.",k:"집에서 하는 일과",lv:"Int",
a:`On weekdays, I usually wake up at 6 in the morning. Then, I take a shower and have breakfast. Around 7 a.m., I leave for school. When I come back home, I like to get some rest in my room. I watch TV or read books.
On weekends, I like to clean my apartment. First, I open all the windows to air out the apartment. Then, I vacuum and mop the floors.
After that, I clean the bathroom and do the dishes. I also do the laundry almost every week.
Last but not least, I take out the garbage every other day. I also take out the food waste separately.
So yeah, these are the things I usually do at home.`,
x:[["air out the apartment","환기시키다"],["vacuum and mop the floors","청소기 돌리고 바닥을 닦다"],["do the dishes / do the laundry","설거지하다 / 빨래하다"],["every other day","격일로"],["separately","따로"],["Last but not least","마지막으로 (중요한 것)"]]});
A({t:"housing",n:"집",q:"Tell me about the house or apartment you lived in when you were a child. How was it different from the one you live in now? What are the differences and the similarities?",k:"어렸을 때 집과 지금 집 비교",lv:"Adv",
a:`I lived in a small house with my family when I was a kid. There was a playground near my house. I used to play there with my friends. We would play in the sand or games like hide-and-seek. And I also used to ride my bike there. Man, I have tons of good memories of that house.
But now, I live in a more spacious apartment. We have four bedrooms now. There is a big park nearby where I can take walks or ride my bike. I can get some exercise or get some fresh air there. Also, there are various types of stores and facilities near my home. There is a bank, a bus stop and a subway station. And there are some convenience stores, some bakeries and a drug store. There are also some restaurants, coffee shops, fast food places and bars.
But you know, every now and then, I really miss my old house.`,
x:[["used to / would + 동사","~하곤 했다 (과거 습관)"],["tons of","수없이 많은"],["more spacious","더 넓은 (비교급)"],["get some fresh air","바람 쐬다"],["every now and then","가끔"]]});
A({t:"housing",n:"집",q:"Tell me about a change you made to your home. What was the change and why did you make that change? How did your home look like afterwards? Give me all the details.",k:"집에 준 변화",lv:"Adv",
a:`I recently made a few changes to make my place nicer. I actually got some new furniture for the apartment a few weeks ago. I bought a new sofa, a new tea table, and umm.. let me think.. oh! some new dressers. After that, we rearranged the furniture in the apartment.
I also bought a new computer and set it up in my room. On top of that, I got a few plants and placed them in the living room.
Once all the changes were done, the apartment looked amazing! I was so happy with the new look. Sure, it was a bit expensive, but it was worth the money I spent.
So yeah, these are the changes I remember making to my apartment.`,
x:[["made a few changes","몇 가지 변화를 주었다"],["rearrange the furniture","가구를 재배치하다"],["On top of that","게다가"],["it was worth the money I spent","쓴 돈이 아깝지 않았다"],["Let me think.. Oh!","생각하는 척 필러 (자연스러움)"]]});
A({t:"housing",n:"집",q:"Now, tell me about the problems you have experienced at home. What were those problems? How did they occur? How did you deal with those problems?",k:"본인 집에 생겼던 여러 문제점들 묘사",lv:"Adv",
a:`I remember a few times when things at home broke down. For example, there was a time when my TV stopped working. It was really frustrating because I couldn't watch anything. Anyway, I couldn't fix it myself, so I called someone to repair it.
I also remember when my computer broke down. I tried to fix it myself but it didn't work, so I took it to the service center to get it fixed.
Oh, and once, I accidentally broke a cup. Of course, I had to clean up the broken glass right away. My mom was pretty upset about that.
Hmm.. what else? Oh! I had some problems with my furniture once, too. So yeah, these are the issues I remember having at home. Hopefully, there won't be any more problems anytime soon!`,
x:[["break down / stop working","고장 나다"],["really frustrating","정말 답답한"],["get it fixed","수리 받다"],["accidentally","실수로"],["clean up the broken glass","깨진 유리를 치우다"]]});
A({t:"housing",n:"집",q:"Pick one of the problems you've mentioned above and tell me in detail about what happened. Tell me how the problem started and how it ended. Tell me how the problem was resolved.",k:"집에 생겼던 한 사건 자세히 묘사 (가구 파손)",lv:"Adv",
a:`As I mentioned, I've had a few problems with my furniture at home.
For example, I remember when my chair got damaged. One of the legs broke and completely fell off. It was impossible to fix it, so I had to throw it away. I eventually got a new chair.
Another time, I remember when my desk got scratched. There were some marks and the paint peeled off. It didn't look good, so I covered it up.
Oh, and there was also the time my bed got a stain. I spilled something on it by mistake. I wiped it off as quickly as I could, but unfortunately the stain didn't come out completely. I had to wash the blanket.
So, those are some of the issues I've had with my furniture.`,
x:[["As I mentioned","앞서 말했듯이 (콤보 연결)"],["got damaged / got scratched","손상됐다 / 긁혔다"],["the paint peeled off","페인트가 벗겨졌다"],["got a stain","얼룩이 졌다"],["by mistake","실수로"],["wipe it off","닦아내다"]]});
A({t:"housing",n:"집",q:"How do you solve problems at home? How is it different from how you or your parents solve problems at home?",k:"14번 집에 생기는 문제 해결 방법 차이 (부모님 vs 나)",lv:"Adv",
a:`To be honest, my parents and I do NOT solve problems at home differently.
For smaller issues, we usually handle them ourselves. For example, there was a time when I accidentally broke a cup. Of course, I cleaned up the broken glass right away. My mom was pretty upset about that.
But when it comes to bigger problems, we definitely get help. For instance, there was a time when my TV stopped working. It was really frustrating because I couldn't watch anything. I couldn't fix it myself, so I called someone to repair it.
So yeah, we don't solve problems at home that differently.`,
x:[["To be honest","솔직히"],["handle them ourselves","직접 처리하다"],["when it comes to ~","~에 관해서는"],["get help","도움을 받다"],["재활용","5번 답변 문장을 그대로 재활용 → 암기량 절약"]]});
A({t:"housing",n:"집",q:"People go through various problems when they rent a house. What is a major problem they experience in your country, and how do people deal with that problem?",k:"15번 집을 구할 때 사람들이 겪는 대표적인 문제, 대처 방법",lv:"Adv",
a:`One of the biggest problems when renting a house is the rent. In South Korea, rent prices are extremely high these days, and it's causing a lot of stress for many people.
People deal with the problem in many ways. Some take out loans to cover the costs, while others move to smaller houses or even to the suburbs.
Honestly, finding a good house with a reasonable rent in Korea feels almost impossible. It's so frustrating. You have to do your homework and put in a lot of effort to find the right place.`,
x:[["One of the biggest problems","가장 큰 문제 중 하나"],["extremely(incredibly) high","엄청나게 높은"],["take out loans","대출을 받다"],["the suburbs","교외"],["reasonable rent","적당한 월세"],["do your homework","사전 조사를 하다"]]});
// Music
A({t:"music",n:"음악 감상",q:"You indicated that you like to listen to music. What type of music do you like listening to? Plus, who is your favorite singer?",k:"좋아하는 음악 장르, 좋아하는 가수",lv:"Int",
a:`When it comes to music, I think I listen to everything. I enjoy a lot of pop, and I'm really into dance music too. But if I had to pick, I'd say rock is my favorite.
One of my favorite singers is a British singer called Anne Marie. She is one of the most well-known musicians in the world. She does a lot of R&B and pop. She also won many music awards.
She has tons of hit songs and among them, 2002 is my favorite. I really like the melody and the lyrics of that song. In fact, most of her songs are very catchy and trendy. I think her music is fast and upbeat. I think she is an incredible singer and amazing dancer. She also has a very nice and unique voice.
And um.. I also like a Korean boy band called BTS. They are one of the biggest groups in Korea. They have a lot of fans overseas because K-POP is really big in the world. There are seven members in the group and they are all very good-looking. My favorite member is RM. He's really cool.
Anyway, I really like their songs.`,
x:[["When it comes to ~","~에 관해서는"],["I'm really into ~","~에 푹 빠져 있다"],["If I had to pick, I'd say ~","굳이 고르자면 ~"],["catchy and trendy","귀에 잘 감기고 트렌디한"],["fast and upbeat / soft and quiet","신나는 / 잔잔한"]]});
A({t:"music",n:"음악 감상",q:"How did you first get interested in music? What kind of music did you listen to when you were young? How was that music different from the music you listen to today? How has your interest in music changed over the years?",k:"음악을 처음 좋아하게 된 계기, 취향 변화",lv:"Adv",
a:`In my teenage years, I used to listen to a Korean group called GOD a lot. They were very big and everyone listened to their songs. They were sensational at that time. They sang and danced very well. They were also very good-looking and very talented. Among their songs, "Lies" was my favorite. I used to listen to it over and over again.
But as I get older, I like to listen to various types of music. I sometimes listen to soft and quiet music. I listen to these songs when I'm studying. And I sometimes listen to upbeat music. I like to listen to these songs when I'm working out.

function splitSent(text){return text.replace(/\n+/g," \n ").split(/(?<=[.!?])\s+(?=[A-Z"(\n])|\s*\n\s*/).map(s=>s.trim()).filter(Boolean)}
let ssRate=store.get("rate",1);
let enVoice=null;
function pickVoice(){if(!hasSS)return;try{const vs=speechSynthesis.getVoices();enVoice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google|samantha|female/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
if(hasSS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
let speakToken=0,audioOK=store.get("audioOK",false);
function stopSpeak(){speakToken++;try{T&&T.stop()}catch(e){}try{hasSS&&(speechSynthesis.speaking||speechSynthesis.pending)&&speechSynthesis.cancel()}catch(e){}}
function noAudio(){if(audioOK)return;showAudioBanner()}
function speak(lines,onLine){
 stopSpeak();const tok=speakToken;onLineCb=onLine||null;
 if(typeof lines==="string")lines=[lines];
 if(T){return T.speak(lines.map((t,i)=>({text:t,id:String(i),language:"en",rate:ssRate})),{voice:"airy"}).then(()=>{audioOK=true;store.set("audioOK",true)}).catch(e=>{if(e&&e.code!=="viewer_stopped")noAudio()})}
 if(!hasSS){noAudio();return Promise.resolve()}
 return new Promise(res=>{let i=0,started=false;
  const guard=setTimeout(()=>{if(!started&&tok===speakToken){noAudio();res()}},2500);
  const next=()=>{if(tok!==speakToken)return res();if(i>=lines.length){clearTimeout(guard);onLineCb&&onLineCb(-1);return res()}
  const u=new SpeechSynthesisUtterance(lines[i]);u.lang="en-US";if(enVoice)u.voice=enVoice;u.rate=ssRate*0.95;const idx=i;
  u.onstart=()=>{started=true;if(!audioOK){audioOK=true;store.set("audioOK",true);hideAudioBanner()}onLineCb&&onLineCb(idx)};
  u.onend=()=>{i++;next()};u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return res();clearTimeout(guard);noAudio();res()};
  try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){noAudio();res()}};next()});
}

const CONN=["because","so","but","and then","also","plus","anyway","actually","you know","i mean","for example","for instance","first","after that","looking back","since then","when it comes to","however","once again","in fact","on top of that","to be honest","honestly","among them","even worse","eventually","meanwhile","while","when i","if not","back in the day","these days","but now","so yeah","let me","guess what","which","that's because","as i mentioned","like i told you","overall","next","last but not least"];
const STOP=new Set("a an the and or but so to of in on at for with is are was were be been i you he she it we they my your our their me this that there here do did does have has had can could would will not no just very really some any about as by from up out what how when where why who which then than too also more much many lot lots tell give".split(" "));
const words=s=>(s.toLowerCase().match(/[a-z']+/g)||[]);
function exprParts(e){return e.toLowerCase().replace(/\(.*?\)/g,"").split("/").map(p=>p.split("~").map(x=>x.replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim()).filter(x=>x.length>1)).filter(a=>a.length)}
function exprHit(e,text){const t=" "+words(text).join(" ")+" ";return exprParts(e).some(parts=>parts.every(p=>t.includes(" "+p+" ")||t.includes(" "+p)))}
function qType(q){const k=q.k;if(q.rp){if(/11번/.test(k))return"rp11";if(/12번/.test(k))return"rp12";return"rp13"}
 if(/15번|문제|이슈|걱정|우려|화제|중요성|핫한/.test(k)&&/15번/.test(k))return"issue";
 if(/14번|비교|변화|차이/.test(k))return"compare";
 if(/경험|에피소드|사건|추억|기억|최근|지난|어렸을|처음|어제|마지막/.test(k))return"past";
 if(/자기소개/.test(k))return"intro";return"desc"}
const TIPS={
 desc:"묘사형: 도입(Well, let me tell you about ~) → 큰 그림 → 세부 2~3개(위치·분위기·특징) → 마무리(So yeah, that's ~). 현재시제를 일관되게 유지하세요.",
 past:"경험형: 언제·누구와·어디서 → 무슨 일이 있었는지 → 감정·결과 → Looking back / Since then 으로 마무리. 과거시제(went, was, had)를 꼭 지키세요.",
 compare:"비교형(14번): 과거(When I was a kid / Back in the day, used to) → 현재(But now / these days) → 공통점·차이점 → Once again 으로 결론 반복.",
 issue:"이슈형(15번): 한 문장 결론(One of the biggest ~ is ~) → 이유·예시 2개(First / Next, For instance) → 사람들의 반응·대처 → 결론 반복.",
 rp11:"롤플레이 11번: 인사 + 전화 목적(I'm calling to ask about ~) → 질문 3~4개(Can you / Do you / I wonder if) → Please get back to me ASAP.",
 rp12:"롤플레이 12번: 상황 설명(I'm so sorry but I have some bad news) → 이유 → 대안 2~3개(Why don't we / How about) → 사과·마무리.",
 rp13:"롤플레이 13번: 비슷한 과거 경험. 경험형처럼 과거시제로 시작-문제-해결-느낀 점 순서.",
 intro:"자기소개는 채점에 거의 반영되지 않아요. 이름·전공·사는 곳·취미 정도로 1분 안에 편하게 워밍업하세요."};
function scoreAnswer(q,text){
 const w=words(text),n=w.length,type=qType(q),adv=q.lv==="Adv";
 if(n<3)return{total:0,n,hits:[],conn:0,lvl:"-"};
 const len=Math.min(n/(adv?130:95),1)*35;
 const lt=" "+w.join(" ")+" ";let conn=0;CONN.forEach(c=>{const m=lt.split(" "+c+" ").length-1;conn+=Math.min(m,2)});
 const connS=Math.min(conn/7,1)*20;
 const uniq=new Set(w).size/n;const div=Math.max(0,Math.min((uniq-.32)/.28,1))*15*Math.min(n/60,1);
 let tense=10*Math.min(n/50,1);
 if(type==="past"||type==="compare"||type==="rp13"){const pm=(text.toLowerCase().match(/\b(was|were|had|went|did|got|used to|ago|\w+ed)\b/g)||[]).length;tense=Math.min(pm/6,1)*10}
 if(type==="rp11"){const qs=(text.match(/\?/g)||[]).length+(lt.match(/ (can you|do you|is there|are there|how much|what time|i wonder|could you|is it) /g)||[]).length;tense=Math.min(qs/4,1)*10}
 const qw=new Set(words(q.q).filter(x=>!STOP.has(x)&&x.length>3));const rel=[...qw].filter(x=>w.includes(x)).length;
 const relS=Math.min(rel/Math.min(4,qw.size||1),1)*10;
 const hits=q.x.filter(x=>!hasKo(x[0])&&exprHit(x[0],text));
 const exS=Math.min(hits.length/3,1)*10;
 const total=Math.round(len+connS+div+tense+relS+exS);
 return{total,n,hits:hits.map(h=>h[0]),conn,lvl:toGrade(total)};
}
